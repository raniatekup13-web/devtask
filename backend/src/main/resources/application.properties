spring.application.name=devtask-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devtask}
spring.datasource.username=${DB_USERNAME:devtask}
spring.datasource.password=${DB_PASSWORD:devtask_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
app.jwt.expiration-ms=86400000

springdoc.swagger-ui.path=/swagger-ui.html
